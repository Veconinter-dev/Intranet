<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accion de Gracias</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f7f8fa;
        color: #333;
    }

    .container {
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* =========================
       IDIOMA
       ========================= */

    .language-selector {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
    }

    .language-selector select {
        border: 1px solid #d7dce2;
        border-radius: 8px;
        background: white;
        padding: 7px 12px;
        font-size: 13px;
        color: #444;
        cursor: pointer;
        outline: none;
    }

    /* =========================
       COMO PARTICIPAR
       ========================= */

    .instructions-section {
        background: white;
        border: 1px solid #e2e6ea;
        border-radius: 12px;
        margin-bottom: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        overflow: hidden;
    }

    .instructions-section summary {
        cursor: pointer;
        list-style: none;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 700;
        color: #444;
        user-select: none;
    }

    .instructions-section summary::-webkit-details-marker {
        display: none;
    }

    .instructions-section summary::before {
        content: "▸";
        display: inline-block;
        margin-right: 8px;
        transition: transform 0.2s ease;
    }

    .instructions-section[open] summary::before {
        transform: rotate(90deg);
    }

    .instructions-content {
        padding: 0 18px 16px 18px;
        border-top: 1px solid #eef0f2;
    }

    .instructions-content ol {
        margin: 14px 0 0 20px;
        padding: 0;
    }

    .instructions-content li {
        margin-bottom: 9px;
        line-height: 1.45;
        font-size: 13px;
        color: #555;
    }

    /* =========================
       TOM
       ========================= */

    .tom-section {
        background: white;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        border: 1px solid #e7e9ec;
    }

    .tom-header {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .tom-image {
        width: 82px;
        height: 82px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .tom-info {
        flex: 1;
        min-width: 0;
    }

    .tom-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
    }

    .tom-status {
        display: inline-flex;
        align-items: center;
        padding: 4px 9px;
        border-radius: 999px;
        background: #eaf7ed;
        color: #27853d;
        font-size: 11px;
        font-weight: 700;
    }

    .tom-bars {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        width: 100%;
    }

    .tom-bar-item {
        min-width: 0;
    }

    .tom-bar-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        color: #555;
        margin-bottom: 4px;
    }

    .tom-bar-value {
        font-weight: 700;
        color: #333;
    }

    .progress-track {
        width: 100%;
        height: 9px;
        background: #eceff2;
        border-radius: 999px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.4s ease;
    }

    .nutrition-fill {
        background: #e5a13a;
    }

    .happiness-fill {
        background: #df7182;
    }

    .energy-fill {
        background: #8a9f61;
    }

    .tom-footer {
        margin-top: 8px;
        font-size: 11px;
        color: #777;
        text-align: right;
    }

    /* =========================
       CABECERA DEL MURO
       ========================= */

    .wall-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .wall-title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        color: #333;
    }

    .wall-subtitle {
        margin: 2px 0 0;
        font-size: 12px;
        color: #777;
    }

    .gratitude-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 14px;
        border-radius: 8px;
        background: #f0b429;
        color: white;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .gratitude-button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    /* =========================
       BUSCADOR
       ========================= */

    .search-container {
        margin-bottom: 14px;
    }

    .search-input {
        width: 100%;
        max-width: 380px;
        padding: 9px 12px;
        border: 1px solid #d9dde2;
        border-radius: 8px;
        background: white;
        font-size: 12px;
        outline: none;
    }

    .search-input:focus {
        border-color: #b9c0c8;
    }

    /* =========================
       MURO
       ========================= */

    .wall {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
    }

    /* =========================
       TARJETAS
       ========================= */

    .gratitude-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e3e6e9;
        box-shadow: 0 2px 7px rgba(0,0,0,0.05);
        min-width: 0;
    }

    .card-background {
        min-height: 250px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        /*
         * El fondo se establece dinámicamente desde JavaScript.
         * La imagen seleccionada se mantiene, pero se aclara
         * mediante una capa blanca para evitar competencia
         * visual con el contenido.
         */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        isolation: isolate;
    }

    /*
     * Capa clara sobre la imagen.
     * La imagen continúa siendo visible, pero con menor intensidad.
     */
    .card-background::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.62);
        z-index: -1;
    }

    .card-top,
    .card-message,
    .card-bottom {
        position: relative;
        z-index: 1;
    }

    .card-top {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .card-recipient {
        font-size: 13px;
        font-weight: 800;
        color: #333;
    }

    .card-from {
        font-size: 11px;
        color: #666;
    }

    .card-message {
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.5;
        color: #444;
        word-break: break-word;
    }

    .card-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        color: #777;
    }

    .card-category {
        font-weight: 700;
    }

    /* =========================
       ESTADO DE CARGA
       ========================= */

    .loading-message {
        grid-column: 1 / -1;
        text-align: center;
        padding: 30px 15px;
        background: white;
        border-radius: 10px;
        border: 1px solid #e5e7ea;
        color: #777;
        font-size: 13px;
    }

    /* =========================
       SIN RESULTADOS
       ========================= */

    .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 30px 15px;
        background: white;
        border-radius: 10px;
        border: 1px solid #e5e7ea;
        color: #777;
        font-size: 13px;
    }

    /* =========================
       ERROR
       ========================= */

    .wall-error {
        grid-column: 1 / -1;
        text-align: center;
        padding: 30px 15px;
        background: white;
        border-radius: 10px;
        border: 1px solid #e5e7ea;
        color: #777;
        font-size: 13px;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1100px) {
        .wall {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
    }

    @media (max-width: 850px) {
        .wall {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .tom-bars {
            gap: 10px;
        }
    }

    @media (max-width: 650px) {
        body {
            padding: 12px;
        }

        .wall {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .tom-header {
            align-items: flex-start;
        }

        .tom-image {
            width: 68px;
            height: 68px;
        }

        .tom-bars {
            grid-template-columns: 1fr;
            gap: 7px;
        }

        .wall-header {
            align-items: flex-start;
        }

        .gratitude-button {
            width: 100%;
        }
    }

    @media (max-width: 430px) {
        .wall {
            grid-template-columns: 1fr;
        }

        .tom-header {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .tom-info {
            width: 100%;
        }

        .tom-title-row {
            justify-content: center;
        }

        .tom-footer {
            text-align: center;
        }
    }
</style>
</head>

    /* =====================================================

    let currentTomState =

    /* =====================================================

       ===================================================== */

    let gratitudeData = [];


    /* =====================================================
       ACTUALIZAR ESTADO VISUAL DE TOM
       ===================================================== */

    function updateTomStatus() {

        const language =
            languageSelector.value;

        const t =
            translations[language];

        const status =
            String(
                currentTomState || "Normal"
            ).toLowerCase();

        let statusText =
            t.tomHappy;

        if (
            status === "normal"
        ) {

            statusText =
                t.tomHappy;

        }

        document.getElementById(
            "tomStatus"
        ).textContent =
            statusText;

    }


    /* =====================================================
       OBTENER NOMBRE DE PERSONA
       ===================================================== */

    function getPersonName(person) {

        if (!person) {
            return "";
        }

        if (typeof person === "string") {
            return person;
        }

        return (
            person.DisplayName ||
            person.Title ||
            person.Email ||
            ""
        );

    }


    /* =====================================================
       OBTENER VALOR DE CAMPO CHOICE
       ===================================================== */

    function getChoiceValue(choice) {

        if (!choice) {
            return "";
        }

        if (typeof choice === "string") {
            return choice;
        }

        return choice.Value || "";

    }


    /* =====================================================
       OBTENER CATEGORÍA INTERNA
       ===================================================== */

    function getCategoryType(value) {

        const category =
            String(value || "").toLowerCase();

        if (
            category.includes(
                "agradecimiento a la empresa"
            )
        ) {

            return "company";

        }

        if (
            category.includes(
                "agradecimiento a un compañero"
            )
        ) {

            return "coworker";

        }

        if (
            category.includes(
                "reconocimiento por una acción positiva"
            )
        ) {

            return "positive";

        }

        return "company";

    }


    /* =====================================================
       OBTENER ETIQUETA DE CATEGORÍA
       ===================================================== */

    function getCategoryLabel(category) {

        const language =
            languageSelector.value;

        const t =
            translations[language];

        if (
            category === "company"
        ) {

            return t.categoryCompany;

        }

        if (
            category === "coworker"
        ) {

            return t.categoryCoworker;

        }

        if (
            category === "positive"
        ) {

            return t.categoryPositive;

        }

        return "";

    }


    /* =====================================================
       FORMATEAR FECHA
       ===================================================== */

    function formatCardDate(dateValue) {

        if (!dateValue) {
            return "";
        }

        const date =
            new Date(dateValue);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }

        const now =
            new Date();

        const startToday =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );

        const startDate =
            new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );

        const difference =
            Math.round(
                (
                    startToday -
                    startDate
                ) /
                86400000
            );

        const language =
            languageSelector.value;

        const t =
            translations[language];

        if (
            difference === 0
        ) {

            return t.today;

        }

        if (
            difference === 1
        ) {

            return t.yesterday;

        }

        return date.toLocaleDateString(
            language === "pt"
                ? "pt-BR"
                : language === "en"
                    ? "en-US"
                    : "es-ES",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       OBTENER URL DEL FONDO SEGÚN FONDOSELECCIONADO
       ===================================================== */

    function getCardBackgroundUrl(
        fondo
    ) {

        const value =
            String(
                fondo || ""
            ).trim();


        /*
         * Fondo1
         * -------------------------
         * otorno.png
         */

        if (
            value === "Fondo1"
        ) {

            return "https://brematlocal.sharepoint.com/sites/GestinHumana/Documentos%20compartidos/IMG/Feriados/otono.png";

        }


        /*
         * Fondo2
         * -------------------------
         * otorno1.png
         */

        if (
            value === "Fondo2"
        ) {

            return "https://brematlocal.sharepoint.com/sites/GestinHumana/Documentos%20compartidos/IMG/Feriados/otono1.png";

        }


        /*
         * Fondo3
         * -------------------------
         * otorno2.png
         */

        if (
            value === "Fondo3"
        ) {

            return "https://brematlocal.sharepoint.com/sites/GestinHumana/Documentos%20compartidos/IMG/Feriados/otono2.png";

        }


        /*
         * Si por alguna razón el campo
         * viene vacío o contiene otro valor,
         * no se coloca ninguna imagen.
         */

        return "";

    }


    /* =====================================================
       CREAR TARJETA
       ===================================================== */

    function createGratitudeCard(
        item
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "gratitude-card";


        /* =================================================
           DATOS
           ================================================= */

        const recipient =
            getPersonName(
                item.Para
            );

        const from =
            getPersonName(
                item.Author
            );

        const message =
            item.Mensaje ||
            "";

        const categoryValue =
            getChoiceValue(
                item.OData__x00bf_Qu_x00e9_quieresreconocer
            );

        const category =
            getCategoryType(
                categoryValue
            );


        /*
         * IMPORTANTE:
         * El fondo se determina exclusivamente
         * mediante FondoSeleccionado.
         */

        const fondo =
            getChoiceValue(
                item.FondoSeleccionado
            );


        const backgroundUrl =
            getCardBackgroundUrl(
                fondo
            );


        const recipientDisplay =
            recipient ||
            "Veconinter";


        /* =================================================
           ATRIBUTOS PARA BUSCADOR
           ================================================= */

        card.setAttribute(
            "data-name",
            recipientDisplay
        );

        card.setAttribute(
            "data-recipient",
            recipientDisplay
        );

        card.setAttribute(
            "data-from",
            from
        );


        /* =================================================
           CONTENEDOR DE FONDO
           ================================================= */

        const background =
            document.createElement(
                "div"
            );

        /*
         * Ya no se agrega ninguna clase
         * fondo1/fondo2/fondo3.
         *
         * El fondo real viene directamente
         * de FondoSeleccionado.
         */

        background.className =
            "card-background";


        /*
         * Aplicar imagen correspondiente.
         */

        if (
            backgroundUrl
        ) {

            background.style.backgroundImage =
                "url('" +
                backgroundUrl +
                "')";

        }


        /* =================================================
           PARTE SUPERIOR
           ================================================= */

        const cardTop =
            document.createElement(
                "div"
            );

        cardTop.className =
            "card-top";


        const recipientElement =
            document.createElement(
                "div"
            );

        recipientElement.className =
            "card-recipient";

        recipientElement.textContent =
            translations[
                languageSelector.value
            ].to +
            " " +
            recipientDisplay;


        const fromElement =
            document.createElement(
                "div"
            );

        fromElement.className =
            "card-from";

        fromElement.textContent =
            translations[
                languageSelector.value
            ].from +
            " " +
            from;


        cardTop.appendChild(
            recipientElement
        );

        cardTop.appendChild(
            fromElement
        );


        /* =================================================
           MENSAJE
           ================================================= */

        const messageElement =
            document.createElement(
                "div"
            );

        messageElement.className =
            "card-message";

        messageElement.textContent =
            message;


        /* =================================================
           PARTE INFERIOR
           ================================================= */

        const cardBottom =
            document.createElement(
                "div"
            );

        cardBottom.className =
            "card-bottom";


        const categoryElement =
            document.createElement(
                "span"
            );

        categoryElement.className =
            "card-category";

        categoryElement.setAttribute(
            "data-category",
            category
        );

        categoryElement.textContent =
            getCategoryLabel(
                category
            );


        const dateElement =
            document.createElement(
                "span"
            );

        dateElement.className =
            "card-date";

        dateElement.textContent =
            formatCardDate(
                item.Created
            );


        cardBottom.appendChild(
            categoryElement
        );

        cardBottom.appendChild(
            dateElement
        );


        /* =================================================
           ARMAR TARJETA
           ================================================= */

        background.appendChild(
            cardTop
        );

        background.appendChild(
            messageElement
        );

        background.appendChild(
            cardBottom
        );

        card.appendChild(
            background
        );


        /*
         * Registro de diagnóstico en consola.
         * Permite comprobar exactamente qué fondo
         * seleccionó el registro y qué URL se utilizó.
         */

        console.log(
            "Tarjeta:",
            {
                destinatario:
                    recipientDisplay,

                fondoSeleccionado:
                    fondo,

                fondoUrl:
                    backgroundUrl
            }
        );


        return card;

    }


    /* =====================================================
       RENDERIZAR MURO
       ===================================================== */

    function renderGratitudeWall() {

        const wall =
            document.getElementById(
                "gratitudeWall"
            );

        wall.innerHTML =
            "";


        if (
            !Array.isArray(
                gratitudeData
            ) ||
            gratitudeData.length === 0
        ) {

            const noResults =
                document.createElement(
                    "div"
                );

            noResults.className =
                "no-results";

            noResults.id =
                "noResults";

            noResults.textContent =
                translations[
                    languageSelector.value
                ].noResults;

            wall.appendChild(
                noResults
            );

            return;

        }


        gratitudeData.forEach(
            function(item) {

                const card =
                    createGratitudeCard(
                        item
                    );

                wall.appendChild(
                    card
                );

            }
        );


        applySearch();

    }


    /* =====================================================
       CARGAR DATOS DEL MURO DESDE POWER AUTOMATE
       ===================================================== */

    async function loadGratitudeWall() {

        if (
            !wallApiUrl
        ) {

            console.warn(
                "La URL de Power Automate para el muro no está configurada."
            );

            return;

        }


        try {

            console.log(
                "Consultando reconocimientos del muro..."
            );


            const response =
                await fetch(
                    wallApiUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: "{}"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            console.log(
                "Respuesta recibida de la API del muro:",
                data
            );


            /* =================================================
               DATOS PUEDE VENIR COMO ARRAY O COMO TEXTO JSON
               ================================================= */

            let records =
                data.datos;


            if (
                typeof records ===
                "string"
            ) {

                try {

                    records =
                        JSON.parse(
                            records
                        );

                }
                catch (
                    parseError
                ) {

                    console.error(
                        "No fue posible convertir datos del muro:",
                        parseError
                    );

                    throw new Error(
                        "Los datos del muro no tienen un formato JSON válido."
                    );

                }

            }


            if (
                !Array.isArray(
                    records
                )
            ) {

                throw new Error(
                    "La respuesta del muro no contiene un arreglo de datos."
                );

            }


            gratitudeData =
                records;


            console.log(
                "Reconocimientos cargados:",
                gratitudeData.length
            );


            renderGratitudeWall();

        }

        catch (
            error
        ) {

            console.error(
                "No fue posible obtener los reconocimientos:",
                error
            );


            const wall =
                document.getElementById(
                    "gratitudeWall"
                );


            wall.innerHTML =
                "";


            const errorElement =
                document.createElement(
                    "div"
                );

            errorElement.className =
                "wall-error";

            errorElement.textContent =
                translations[
                    languageSelector.value
                ].wallError;


            wall.appendChild(
                errorElement
            );

        }

    }


    /* =====================================================
       FUNCIÓN CAMBIO DE IDIOMA
       ===================================================== */

    function setLanguage(
        language
    ) {

        const t =
            translations[
                language
            ];


        if (
            !t
        ) {

            return;

        }


        document.documentElement.lang =
            language;


        /* =================================================
           COMO PARTICIPAR
           ================================================= */

        document.getElementById(
            "instructionsTitle"
        ).textContent =
            t.instructionsTitle;


        const instructionsList =
            document.getElementById(
                "instructionsList"
            );


        instructionsList.innerHTML =
            "";


        t.instructions.forEach(
            function(item) {

                const li =
                    document.createElement(
                        "li"
                    );

                li.textContent =
                    item;

                instructionsList.appendChild(
                    li
                );

            }
        );


        /* =================================================
           TOM
           ================================================= */

        document.getElementById(
            "nutritionLabel"
        ).textContent =
            t.nutrition;


        document.getElementById(
            "happinessLabel"
        ).textContent =
            t.happiness;


        document.getElementById(
            "energyLabel"
        ).textContent =
            t.energy;


        updateTomStatus();


        document.getElementById(
            "recognitionsLabel"
        ).textContent =
            t.recognitions;


        /* =================================================
           MURO
           ================================================= */

        document.getElementById(
            "wallTitle"
        ).textContent =
            t.wallTitle;


        document.getElementById(
            "wallSubtitle"
        ).textContent =
            t.wallSubtitle;


        document.getElementById(
            "gratitudeButton"
        ).textContent =
            t.gratitudeButton;


        document.getElementById(
            "searchInput"
        ).placeholder =
            t.searchPlaceholder;


        /* =================================================
           VOLVER A RENDERIZAR TARJETAS
           PARA ACTUALIZAR IDIOMA
           ================================================= */

        if (
            Array.isArray(
                gratitudeData
            ) &&
            gratitudeData.length > 0
        ) {

            renderGratitudeWall();

        }


        /* =================================================
           GUARDAR IDIOMA
           ================================================= */

        localStorage.setItem(
            "saveTheTurkeyLanguage",
            language
        );

    }


    /* =====================================================
       CARGAR DATOS DE TOM DESDE POWER AUTOMATE
       ===================================================== */

    async function loadTomData() {

        if (
            !tomApiUrl ||
            tomApiUrl ===
                "PEGA_AQUI_LA_URL_DEL_FLUJO"
        ) {

            console.warn(
                "La URL de Power Automate para Tom todavía no ha sido configurada."
            );

            return;

        }


        try {

            console.log(
                "Consultando datos de Tom..."
            );


            const response =
                await fetch(
                    tomApiUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: "{}"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            console.log(
                "Respuesta recibida de Power Automate:",
                data
            );


            /* =================================================
               VALIDAR DATOS
               ================================================= */

            if (
                typeof data.nutricion !==
                    "number" ||
                typeof data.felicidad !==
                    "number" ||
                typeof data.energia !==
                    "number" ||
                typeof data.reconocimientos !==
                    "number"
            ) {

                throw new Error(
                    "La respuesta de Power Automate no tiene el formato esperado."
                );

            }


            /* =================================================
               LIMITAR LOS VALORES ENTRE 0 Y 100
               ================================================= */

            const nutricion =
                Math.max(
                    0,
                    Math.min(
                        100,
                        data.nutricion
                    )
                );


            const felicidad =
                Math.max(
                    0,
                    Math.min(
                        100,
                        data.felicidad
                    )
                );


            const energia =
                Math.max(
                    0,
                    Math.min(
                        100,
                        data.energia
                    )
                );


            /* =================================================
               ACTUALIZAR NUTRICIÓN
               ================================================= */

            document.getElementById(
                "nutritionValue"
            ).textContent =
                nutricion +
                "%";


            document.getElementById(
                "nutritionBar"
            ).style.width =
                nutricion +
                "%";


            /* =================================================
               ACTUALIZAR FELICIDAD
               ================================================= */

            document.getElementById(
                "happinessValue"
            ).textContent =
                felicidad +
                "%";


            document.getElementById(
                "happinessBar"
            ).style.width =
                felicidad +
                "%";


            /* =================================================
               ACTUALIZAR ENERGÍA
               ================================================= */

            document.getElementById(
                "energyValue"
            ).textContent =
                energia +
                "%";


            document.getElementById(
                "energyBar"
            ).style.width =
                energia +
                "%";


            /* =================================================
               ACTUALIZAR RECONOCIMIENTOS
               ================================================= */

            document.getElementById(
                "recognitionsValue"
            ).textContent =
                data.reconocimientos;


            /* =================================================
               ACTUALIZAR ESTADO
               ================================================= */

            currentTomState =
                data.estado ||
                "Normal";


            updateTomStatus();


            console.log(
                "Tom actualizado correctamente:",
                {
                    nutricion:
                        nutricion,

                    felicidad:
                        felicidad,

                    energia:
                        energia,

                    reconocimientos:
                        data.reconocimientos,

                    estado:
                        currentTomState
                }
            );

        }

        catch (
            error
        ) {

            console.error(
                "No fue posible obtener los datos de Tom:",
                error
            );

        }

    }


    /* =====================================================
       BUSCADOR
       ===================================================== */

    const searchInput =
        document.getElementById(
            "searchInput"
        );


    function applySearch() {

        const searchValue =
            searchInput.value
                .toLowerCase()
                .trim();


        const cards =
            document.querySelectorAll(
                ".gratitude-card"
            );


        let visibleCards =
            0;


        cards.forEach(
            function(card) {

                const name =
                    (
                        card.getAttribute(
                            "data-name"
                        ) || ""
                    )
                    .toLowerCase();


                if (
                    searchValue === "" ||
                    name.includes(
                        searchValue
                    )
                ) {

                    card.style.display =
                        "";

                    visibleCards++;

                }

                else {

                    card.style.display =
                        "none";

                }

            }
        );


        const existingNoResults =
            document.getElementById(
                "noResults"
            );


        if (
            visibleCards === 0 &&
            searchValue !== ""
        ) {

            if (
                !existingNoResults
            ) {

                const noResults =
                    document.createElement(
                        "div"
                    );

                noResults.id =
                    "noResults";

                noResults.className =
                    "no-results";

                noResults.textContent =
                    translations[
                        languageSelector.value
                    ].noResults;


                document.getElementById(
                    "gratitudeWall"
                ).appendChild(
                    noResults
                );

            }

        }

        else {

            if (
                existingNoResults
            ) {

                existingNoResults.remove();

            }

        }

    }


    searchInput.addEventListener(
        "input",
        function() {

            applySearch();

        }
    );


    /* =====================================================
       CARGAR IDIOMA GUARDADO
       ===================================================== */

    const savedLanguage =
        localStorage.getItem(
            "saveTheTurkeyLanguage"
        );


    const initialLanguage =
        translations[
            savedLanguage
        ]
            ? savedLanguage
            : "es";


    languageSelector.value =
        initialLanguage;


    setLanguage(
        initialLanguage
    );


    /* =====================================================
       CAMBIAR IDIOMA
       ===================================================== */

    languageSelector.addEventListener(
        "change",
        function() {

            setLanguage(
                this.value
            );

        }
    );


    /* =====================================================
       CARGAR TOM
       ===================================================== */

    loadTomData();


    /* =====================================================
       CARGAR MURO
       ===================================================== */

    loadGratitudeWall();

</script>
