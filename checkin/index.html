<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Check-In Corporativo</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    width: 100%;
    max-width: 100%;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

h2{
    color:#0078D4;
}

</style>

</head>

<body>

<div class="card">

<h2 id="titulo">
Validando acceso corporativo...
</h2>

<p id="mensaje"></p>

</div>

<script>

async function validarAcceso(){

    try{
        // Obtener la IP pública del cliente y permitir solo 38.137.234.131
        const ipResp = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResp.json();
        const clientIp = ipData && ipData.ip ? ipData.ip : null;

        const allowedIps = ['38.137.234.131', '186.167.5.34', '181.225.48.246', '181.161.66.44', '45.234.61.94', '181.161.94.217', '38.137.234.142'];

        let allowed = false;
        if (clientIp){
            // clientIp puede venir como "ip1, ip2" — dividir y comparar usando includes()/some()
            const parts = clientIp.split(',').map(s => s.trim());
            if (parts.some(ip => allowedIps.includes(ip))) allowed = true;
            // Alternativamente, para una comprobación por subcadena:
            // if (allowedIps.some(a => clientIp.includes(a))) allowed = true;
        }

        if (allowed){
            const embedUrl = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=2ua7Zek1GEyZO-4sFst-ZBpeDAsVsrNFl4nY8f6Ey3hUMlNDRVRXT1U5VEYzSTZJRUZSTzE3RExaMi4u&embed=true";
            document.getElementById("titulo").innerHTML = "";
            document.getElementById("mensaje").innerHTML =
                `<iframe width="100%" height="1078vh" src="${embedUrl}" frameborder="0" marginwidth="0" marginheight="0" style="border: none; max-width:100%;" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe>`;
            return;
        }

        // No autorizado
        document.getElementById("titulo").innerHTML = "Acceso denegado";
        document.getElementById("mensaje").innerHTML =
            "El check-in solo puede realizarse dentro de la oficina.";

    }
    catch(error){
        // En caso de error al obtener la IP, mostrar mensaje de error genérico
        document.getElementById("titulo").innerHTML = "Error";
        document.getElementById("mensaje").innerHTML = "No fue posible validar el acceso.";
        console.error('validarAcceso error:', error);
    }

}

validarAcceso();

</script>

</body>

</html>
