<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Check-In Corporativo</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:12px;
    width:420px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

h2{
    color:#0078D4;
}

</style>

</head>

<body>

<div class="card">

<h2 id="titulo">
Validando acceso corporativo...
</h2>

<p id="mensaje"></p>

</div>

<script>

async function validarAcceso(){

    try{

        const response = await fetch(
        "https://TU_API.azurewebsites.net/api/validar");

        const data = await response.json();

        if(data.permitido === true){

            window.location.href =
            "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=2ua7Zek1GEyZO-4sFst-ZBpeDAsVsrNFl4nY8f6Ey3hUMlNDRVRXT1U5VEYzSTZJRUZSTzE3RExaMi4u";

        }
        else{

            document.getElementById("titulo")
            .innerHTML = "Acceso denegado";

            document.getElementById("mensaje")
            .innerHTML =
            "El check-in solo puede realizarse dentro de la oficina o conectado mediante VPN corporativa.";

        }

    }
    catch(error){

        document.getElementById("titulo")
        .innerHTML = "Error";

        document.getElementById("mensaje")
        .innerHTML =
        "No fue posible validar el acceso.";

    }

}

validarAcceso();

</script>

</body>

</html>
